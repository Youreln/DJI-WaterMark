<!DOCTYPE html>
<html lang="zh-CN">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DJI 水印下载中心</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        * { font-family: 'Inter', sans-serif; }
        body { background: linear-gradient(135deg, #0a0a0f 0%, #12121a 50%, #0d0d14 100%); }
        .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .glass-strong { background: rgba(255, 255, 255, 0.08); backdrop-filter: blur(30px); border: 1px solid rgba(255, 255, 255, 0.15); }
        .card-hover { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .card-hover:hover { transform: translateY(-8px); box-shadow: 0 20px 40px rgba(0, 180, 255, 0.15), 0 0 60px rgba(0, 180, 255, 0.05); }
        .text-glow { text-shadow: 0 0 20px rgba(0, 180, 255, 0.3); }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
        .animate-fade { animation: fadeIn 0.3s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .checkbox-glow { accent-color: #00b4ff; }
        .checkbox-glow:checked { box-shadow: 0 0 20px rgba(0, 180, 255, 0.5); }
    </style>
</head>
<body class="min-h-screen text-white">
    <header class="fixed top-0 left-0 right-0 z-50 glass">

            <div class="flex items-center justify-between">

                        <svg viewBox="0 0 24 24" class="w-8 h-8 text-white" fill="currentColor">
                            <path d="M3 12h4l2-5 2 10 2-5h4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>

                </div>
            </div>
        </div>
    </header>

                    </div>
                    <div class="flex gap-3 flex-wrap">

                            <option value="drone">无人机系列</option>
                            <option value="osmo">手持设备系列</option>

                            <option value="24">24px</option>
                            <option value="48">48px</option>
                            <option value="56">56px</option>
                        </select>
                    </div>
                    <div class="flex bg-black/30 border border-white/10 rounded-xl overflow-hidden">
                        <button id="cardViewBtn" class="px-4 py-3 bg-cyan-500/20 text-cyan-400 flex items-center gap-2 transition-colors">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">

                            </svg>
                            <span class="hidden sm:inline">目录树</span>

                    </div>
                </div>
            </div>

            <div id="cardView" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">
            </div>

                </div>
            </div>
        </div>
    </div>

        function getFileInfo(file) {
            const name = file.split('/').pop();
            const ext = name.split('.').pop().toLowerCase();
            let size = '';
            let lang = '';
            
            if (name.includes('24')) size = '24px';
            else if (name.includes('48')) size = '48px';
            else if (name.includes('56')) size = '56px';
            
            const langMatch = file.match(/\/(en|sc|tc|kr|jp|de|fr|es|it|ru|br|cn)\//);
            if (langMatch) lang = langMatch[1];
            
            return { name, ext, size, lang };
        }

        function openPreview(src) {
            document.getElementById('previewImage').src = src;
            document.getElementById('previewModal').classList.remove('hidden');
            document.body.style.overflow = 'hidden';
        }
        
        function closePreview() {
            document.getElementById('previewModal').classList.add('hidden');
            document.body.style.overflow = '';
        }

        function renderCardView() {
            const cardView = document.getElementById('cardView');
            cardView.innerHTML = '';
            
            const search = document.getElementById('searchInput').value.toLowerCase();
            const category = document.getElementById('categorySelect').value;
            const size = document.getElementById('sizeSelect').value;
            
            let allItems = [];
            if (category === '' || category === 'drone') {
                watermarkData.drone.forEach(item => allItems.push({ ...item, category: 'drone' }));
            }
            if (category === '' || category === 'osmo') {
                watermarkData.osmo.forEach(item => allItems.push({ ...item, category: 'osmo' }));
            }
            
            allItems.forEach(item => {
                const filteredFiles = item.files.filter(file => {
                    if (file.includes('.DS_Store')) return false;
                    const info = getFileInfo(file);
                    if (search && !item.name.toLowerCase().includes(search) && !file.toLowerCase().includes(search)) return false;
                    if (size && info.size !== `${size}px`) return false;
                    return true;
                });
                
                if (filteredFiles.length === 0) return;
                
                const card = document.createElement('div');
                card.className = 'glass rounded-xl p-5 card-hover animate-fade';
                card.innerHTML = `
                    <div class="flex items-start justify-between mb-4">
                        <div>
                            <h3 class="font-medium text-white mb-1">${item.name}</h3>
                            <span class="text-xs px-2 py-1 rounded-full ${item.category === 'drone' ? 'bg-cyan-500/20 text-cyan-400' : 'bg-purple-500/20 text-purple-400'}">
                                ${item.category === 'drone' ? '无人机' : '手持设备'}
                            </span>
                        </div>
                        <span class="text-xs text-gray-500">${filteredFiles.length} 文件</span>
                    </div>
                    <div class="grid grid-cols-4 gap-2">
                        ${filteredFiles.slice(0, 8).map(file => {
                            const info = getFileInfo(file);
                            const filePath = `${item.path}/${file}`;
                            const isImage = ['png', 'svg'].includes(info.ext);
                            return `
                                <div class="relative group cursor-pointer">
                                    <div class="aspect-square bg-black/30 rounded-lg overflow-hidden flex items-center justify-center" onclick="${isImage ? `openPreview('${filePath}')` : ''}">
                                        ${isImage ? `<img src="${filePath}" alt="${info.name}" class="w-full h-full object-contain opacity-80 group-hover:opacity-100 transition-opacity" />` : `
                                            <svg class="w-6 h-6 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
                                            </svg>
                                        `}
                                    </div>
                                    <div class="absolute -bottom-1 left-1/2 -translate-x-1/2 bg-black/80 text-xs text-white px-1.5 py-0.5 rounded opacity-0 group-hover:opacity-100 transition-opacity whitespace-nowrap">
                                        ${info.name}
                                    </div>
                                    <a href="${filePath}" download="${info.name}" class="absolute inset-0"></a>
                                </div>
                            `;
                        }).join('')}
                    </div>
                    ${filteredFiles.length > 8 ? `<p class="text-xs text-gray-500 mt-3 text-center">+${filteredFiles.length - 8} 更多文件</p>` : ''}
                `;
                cardView.appendChild(card);
            });
            
            if (cardView.children.length === 0) {
                cardView.innerHTML = '<div class="col-span-full text-center py-12 text-gray-500 animate-fade">暂无匹配的水印文件</div>';
            }
        }

        function renderTreeView() {
            const treeContent = document.getElementById('treeContent');
            treeContent.innerHTML = '';
            
            const search = document.getElementById('searchInput').value.toLowerCase();
            const category = document.getElementById('categorySelect').value;
            const size = document.getElementById('sizeSelect').value;
            
            function renderCategory(catName, data, label) {
                if (category && category !== catName) return '';
                
                const items = data.filter(item => {
                    if (search && !item.name.toLowerCase().includes(search)) return false;
                    return item.files.some(file => {
                        if (file.includes('.DS_Store')) return false;
                        const info = getFileInfo(file);
                        if (size && info.size !== `${size}px`) return false;
                        if (search && !file.toLowerCase().includes(search)) return false;
                        return true;
                    });
                });
                
                if (items.length === 0) return '';
                
                return `
                    <div class="mb-2">
                        <div class="flex items-center gap-2 px-2 py-2 rounded-lg hover:bg-white/5 cursor-pointer font-medium text-cyan-400" onclick="toggleFolder(this)">
                            <svg class="w-4 h-4 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
                            </svg>
                            ${label} (${items.length})
                        </div>
                        <div class="ml-4 pl-2 border-l border-white/10">
                            ${items.map(item => {
                                const filteredFiles = item.files.filter(file => {
                                    if (file.includes('.DS_Store')) return false;
                                    const info = getFileInfo(file);
                                    if (size && info.size !== `${size}px`) return false;
                                    if (search && !file.toLowerCase().includes(search)) return false;
                                    return true;
                                });
                                
                                return `
                                    <div class="mb-1">
                                        <div class="flex items-center gap-2 px-2 py-1.5 rounded-lg hover:bg-white/5 cursor-pointer text-sm" onclick="toggleFolder(this)">
                                            <svg class="w-4 h-4 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/>
                                            </svg>
                                            ${item.name} (${filteredFiles.length})
                                        </div>
                                        <div class="ml-4 pl-2 border-l border-white/10">
                                            ${filteredFiles.map(file => {
                                                const info = getFileInfo(file);
                                                const filePath = `${item.path}/${file}`;
                                                const isImage = ['png', 'svg'].includes(info.ext);
                                                return `
                                                    <div class="flex items-center gap-2 px-2 py-1 rounded-lg hover:bg-white/5 cursor-pointer text-xs text-gray-400 hover:text-white transition-colors animate-fade" onclick="${isImage ? `openPreview('${filePath}')` : ''}">
                                                        ${isImage ? `<img src="${filePath}" alt="${info.name}" class="w-4 h-4 object-contain rounded" />` : `
                                                            <svg class="w-4 h-4 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
                                                            </svg>
                                                        `}
                                                        <span>${info.name}</span>
                                                        ${info.size ? `<span class="text-gray-600">${info.size}</span>` : ''}
                                                    </div>
                                                    <a href="${filePath}" download="${info.name}" class="flex items-center gap-2 px-2 py-1 rounded-lg hover:bg-white/5 cursor-pointer text-xs text-gray-400 hover:text-white transition-colors animate-fade">
                                                        <svg class="w-4 h-4 text-cyan-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/>
                                                        </svg>
                                                    </a>
                                                `;
                                            }).join('')}
                                        </div>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    </div>
                `;
            }
            
            treeContent.innerHTML = `
                ${renderCategory('drone', watermarkData.drone, '无人机系列')}
                ${renderCategory('osmo', watermarkData.osmo, '手持设备系列')}
            `;
            
            if (treeContent.innerHTML.trim() === '') {
                treeContent.innerHTML = '<div class="text-center py-8 text-gray-500">暂无匹配的水印文件</div>';
            }
        }

        function toggleFolder(el) {
            const nextEl = el.parentElement.querySelector(':scope > div');
            if (nextEl) {
                nextEl.classList.toggle('hidden');
                const svg = el.querySelector('svg');
                if (svg) svg.classList.toggle('rotate-90');
            }
        }

        window.toggleFolder = toggleFolder;

        document.getElementById('searchInput').addEventListener('input', () => {
            document.getElementById('cardView').classList.contains('hidden') ? renderTreeView() : renderCardView();
        });

        document.getElementById('categorySelect').addEventListener('change', () => {
            document.getElementById('cardView').classList.contains('hidden') ? renderTreeView() : renderCardView();
        });

        document.getElementById('sizeSelect').addEventListener('change', () => {
            document.getElementById('cardView').classList.contains('hidden') ? renderTreeView() : renderCardView();
        });

        document.getElementById('cardViewBtn').addEventListener('click', () => {
            document.getElementById('cardViewBtn').classList.add('bg-cyan-500/20', 'text-cyan-400');
            document.getElementById('treeViewBtn').classList.remove('bg-cyan-500/20', 'text-cyan-400');
            document.getElementById('treeViewBtn').classList.add('text-gray-400');
            document.getElementById('cardView').classList.remove('hidden');
            document.getElementById('treeView').classList.add('hidden');
            renderCardView();
        });

        document.getElementById('treeViewBtn').addEventListener('click', () => {
            document.getElementById('treeViewBtn').classList.add('bg-cyan-500/20', 'text-cyan-400');
            document.getElementById('cardViewBtn').classList.remove('bg-cyan-500/20', 'text-cyan-400');
            document.getElementById('cardViewBtn').classList.add('text-gray-400');
            document.getElementById('treeView').classList.remove('hidden');
            document.getElementById('cardView').classList.add('hidden');
            renderTreeView();
        });

        renderCardView();
    </script>
